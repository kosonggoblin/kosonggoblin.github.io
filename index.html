<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Download App - NilaiX</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1b2735 0%, #090a0f 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* Simplified Stars - hanya dengan CSS gradient */
        .stars-simple {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            background-image: 
                radial-gradient(2px 2px at 20px 30px, #fff, rgba(0,0,0,0)),
                radial-gradient(1px 1px at 40px 70px, #fff, rgba(0,0,0,0)),
                radial-gradient(1px 1px at 80px 20px, #fff, rgba(0,0,0,0)),
                radial-gradient(3px 3px at 150px 90px, #fff, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 250px 150px, #fff, rgba(0,0,0,0)),
                radial-gradient(1px 1px at 350px 50px, #fff, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 500px 200px, #fff, rgba(0,0,0,0)),
                radial-gradient(1px 1px at 600px 300px, #fff, rgba(0,0,0,0)),
                radial-gradient(3px 3px at 750px 100px, #fff, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 900px 400px, #fff, rgba(0,0,0,0)),
                radial-gradient(1px 1px at 1050px 250px, #fff, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 1200px 150px, #fff, rgba(0,0,0,0)),
                radial-gradient(3px 3px at 50px 400px, #fff, rgba(0,0,0,0)),
                radial-gradient(1px 1px at 300px 500px, #fff, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 550px 600px, #fff, rgba(0,0,0,0)),
                radial-gradient(1px 1px at 800px 700px, #fff, rgba(0,0,0,0)),
                radial-gradient(3px 3px at 1000px 550px, #fff, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 1100px 650px, #fff, rgba(0,0,0,0));
            background-repeat: no-repeat;
            background-size: 200px 200px, 150px 150px, 180px 180px, 250px 250px, 
                            220px 220px, 160px 160px, 240px 240px, 170px 170px,
                            260px 260px, 210px 210px, 190px 190px, 230px 230px,
                            270px 270px, 200px 200px, 250px 250px, 180px 180px,
                            280px 280px, 220px 220px;
            opacity: 0.6;
        }

        /* MAIN CONTAINER - lebih ringan */
        .main-container {
            position: relative;
            z-index: 10;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border-radius: 30px;
            padding: clamp(30px, 5vw, 50px);
            text-align: center;
            max-width: 650px;
            width: 100%;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            animation: fadeInUp 0.8s ease-out;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* APP ICON - simple */
        .app-icon-wrapper {
            position: relative;
            width: clamp(100px, 20vw, 140px);
            height: clamp(100px, 20vw, 140px);
            margin: 0 auto 25px;
        }

        .app-icon {
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 25px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: clamp(50px, 10vw, 70px);
            box-shadow: 0 15px 40px rgba(102, 126, 234, 0.4);
            transition: transform 0.3s ease;
        }

        .app-icon:hover {
            transform: scale(1.05);
        }

        /* TITLE */
        .title {
            font-size: clamp(1.8em, 6vw, 3em);
            font-weight: 900;
            background: linear-gradient(135deg, #667eea, #764ba2, #f093fb, #f5576c);
            background-size: 300% 300%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px;
        }

        .subtitle {
            font-size: clamp(0.9em, 4vw, 1.3em);
            color: rgba(255, 255, 255, 0.85);
            margin-bottom: 30px;
        }

        /* FEATURES - grid untuk responsif */
        .features {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 35px;
        }

        .feature-card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            padding: 15px 12px;
            min-width: 100px;
            flex: 1;
            transition: all 0.3s ease;
            border: 1px solid rgba(255, 255, 255, 0.1);
            cursor: pointer;
        }

        .feature-card:hover {
            transform: translateY(-5px);
            background: rgba(102, 126, 234, 0.2);
            border-color: rgba(102, 126, 234, 0.5);
        }

        .feature-icon {
            font-size: 2em;
            margin-bottom: 8px;
        }

        .feature-text {
            color: white;
            font-weight: bold;
            font-size: 0.85em;
        }

        /* DOWNLOAD BUTTON */
        .download-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: clamp(14px, 4vw, 22px) clamp(30px, 8vw, 60px);
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            text-decoration: none;
            border-radius: 60px;
            font-size: clamp(1em, 4vw, 1.4em);
            font-weight: bold;
            transition: all 0.3s ease;
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
            border: none;
            cursor: pointer;
            width: 100%;
            max-width: 320px;
        }

        .download-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 40px rgba(118, 75, 162, 0.5);
        }

        .download-button:active {
            transform: translateY(0);
        }

        /* VERSION BADGE */
        .version-badge {
            display: inline-block;
            margin-top: 20px;
            padding: 8px 20px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 30px;
            color: rgba(255, 255, 255, 0.8);
            font-size: 0.85em;
            font-size: clamp(0.75em, 3vw, 0.9em);
        }

        /* COUNTER */
        .counter {
            color: rgba(255, 255, 255, 0.7);
            margin-top: 12px;
            font-size: 0.9em;
        }

        .counter-number {
            font-size: 1.2em;
            font-weight: bold;
            color: #feca57;
        }

        /* Responsive untuk tablet dan mobile */
        @media (max-width: 768px) {
            .features {
                gap: 12px;
            }
            
            .feature-card {
                padding: 12px 10px;
            }
            
            .feature-icon {
                font-size: 1.8em;
            }
        }

        @media (max-width: 480px) {
            .main-container {
                padding: 25px 18px;
            }
            
            .features {
                flex-direction: column;
            }
            
            .feature-card {
                min-width: auto;
            }
        }

        /* Animasi sederhana untuk loading state */
        @keyframes pulse {
            0%, 100% { opacity: 0.6; }
            50% { opacity: 1; }
        }

        .loading {
            animation: pulse 1s ease-in-out infinite;
        }
    </style>
</head>
<body>
    <!-- Stars sederhana dengan CSS gradient -->
    <div class="stars-simple"></div>

    <!-- MAIN CONTENT -->
    <div class="main-container">
        <!-- App Icon -->
        <div class="app-icon-wrapper">
            <div class="app-icon">🚀</div>
        </div>

        <!-- Title -->
        <h1 class="title">Chat NilaiX</h1>
        <p class="subtitle">🌌 Bergabunglah Untuk Merubah Nilai Error Anda</p>

        <!-- Features -->
        <div class="features">
            <div class="feature-card">
                <div class="feature-icon">⚡</div>
                <div class="feature-text">Kecepatan<br>Cahaya</div>
            </div>
            <div class="feature-card">
                <div class="feature-icon">🛡️</div>
                <div class="feature-text">Keamanan<br>Maksimal</div>
            </div>
            <div class="feature-card">
                <div class="feature-icon">✨</div>
                <div class="feature-text">Fitur<br>Magis</div>
            </div>
        </div>

        <!-- Download Button -->
        <a href="https://kosonggoblin.github.io/NilaiE.apk" class="download-button" id="downloadBtn">
            🚀 DOWNLOAD SEKARANG
        </a>

        <!-- Version Badge -->
        <div class="version-badge">
            📱 Versi 3.0.1 • 28 MB • Semua Platform
        </div>

        <!-- Download Counter -->
        <div class="counter">
            🌟 Bergabung dengan <span class="counter-number" id="downloadCount">0</span>+ sang penjaga
        </div>
    </div>

    <script>
        // Simple counter animation dengan requestAnimationFrame untuk performa lebih baik
        function animateCounter() {
            const counter = document.getElementById('downloadCount');
            const target = 287654;
            const duration = 2000;
            let startTime = null;
            let startValue = 0;
            
            function updateCounter(currentTime) {
                if (!startTime) startTime = currentTime;
                const elapsed = currentTime - startTime;
                const progress = Math.min(elapsed / duration, 1);
                
                // Easing function untuk animasi lebih halus
                const easeOutQuart = 1 - Math.pow(1 - progress, 4);
                const currentValue = Math.floor(startValue + (target - startValue) * easeOutQuart);
                counter.textContent = currentValue.toLocaleString();
                
                if (progress < 1) {
                    requestAnimationFrame(updateCounter);
                }
            }
            
            requestAnimationFrame(updateCounter);
        }

        // Simple particle effect dengan performa lebih baik
        function createSimpleParticles(x, y) {
            const particles = [];
            const emojis = ['✨', '⭐', '🌟', '🚀', '💜'];
            
            for (let i = 0; i < 12; i++) {
                const particle = document.createElement('div');
                particle.textContent = emojis[Math.floor(Math.random() * emojis.length)];
                particle.style.cssText = `
                    position: fixed;
                    left: ${x}px;
                    top: ${y}px;
                    font-size: 20px;
                    pointer-events: none;
                    z-index: 1000;
                    opacity: 1;
                    transition: all 0.8s ease-out;
                `;
                
                const angle = (Math.PI * 2 * i) / 12;
                const distance = 80 + Math.random() * 40;
                const tx = Math.cos(angle) * distance;
                const ty = Math.sin(angle) * distance;
                
                document.body.appendChild(particle);
                
                // Gunakan requestAnimationFrame untuk animasi
                requestAnimationFrame(() => {
                    particle.style.transform = `translate(${tx}px, ${ty}px)`;
                    particle.style.opacity = '0';
                });
                
                setTimeout(() => particle.remove(), 800);
            }
        }

        // Simple notification
        function showSimpleNotification(message) {
            const notif = document.createElement('div');
            notif.style.cssText = `
                position: fixed;
                top: 20px;
                right: 20px;
                background: linear-gradient(135deg, #667eea, #764ba2);
                color: white;
                padding: 15px 25px;
                border-radius: 15px;
                backdrop-filter: blur(10px);
                border: 1px solid rgba(255,255,255,0.2);
                box-shadow: 0 10px 30px rgba(0,0,0,0.2);
                z-index: 1000;
                animation: slideInRight 0.3s ease-out;
                font-weight: bold;
                font-size: 14px;
            `;
            notif.innerHTML = message;
            
            // Tambahkan keyframes jika belum ada
            if (!document.querySelector('#notifStyles')) {
                const style = document.createElement('style');
                style.id = 'notifStyles';
                style.textContent = `
                    @keyframes slideInRight {
                        from { transform: translateX(100%); opacity: 0; }
                        to { transform: translateX(0); opacity: 1; }
                    }
                    @keyframes slideOutRight {
                        to { transform: translateX(100%); opacity: 0; }
                    }
                `;
                document.head.appendChild(style);
            }
            
            document.body.appendChild(notif);
            
            setTimeout(() => {
                notif.style.animation = 'slideOutRight 0.3s ease-out forwards';
                setTimeout(() => notif.remove(), 300);
            }, 2500);
        }

        // Handle download click
        const downloadBtn = document.getElementById('downloadBtn');
        
        downloadBtn.addEventListener('click', function(e) {
            e.preventDefault();
            
            // Button feedback
            const originalText = this.innerHTML;
            this.innerHTML = '⏳ MEMPROSES...';
            this.style.opacity = '0.8';
            
            // Dapatkan posisi klik
            const rect = this.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;
            
            // Efek partikel
            createSimpleParticles(centerX, centerY);
            
            // Notifikasi
            showSimpleNotification('🚀 Download Dimulai! Menjelajah ke galaksi berikutnya...');
            
            // Simulasi loading sebentar
            setTimeout(() => {
                this.innerHTML = originalText;
                this.style.opacity = '1';
                // Arahkan ke link download
                window.location.href = this.href;
            }, 500);
        });

        // Inisialisasi counter
        animateCounter();
        
        // Optional: Simple hover effect untuk feature cards
        document.querySelectorAll('.feature-card').forEach(card => {
            card.addEventListener('click', () => {
                const text = card.querySelector('.feature-text').innerText;
                showSimpleNotification(`✨ ${text} akan segera hadir!`);
            });
        });
    </script>
</body>
</html>
